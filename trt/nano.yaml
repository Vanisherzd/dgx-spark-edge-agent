# extra_llm_api_options for trtllm-serve on the DGX Spark (Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4).
# free_gpu_memory_fraction is a share of the *free* memory at startup; 0.5 leaves room for OpenShell/NemoClaw and RAG.
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.5
  mamba_ssm_cache_dtype: float32
max_batch_size: 8
cuda_graph_config:
  enable_padding: true
